<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        /* SESSION VALIDATION: Includes localhost bypass for development */
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (!isLocal && sessionStorage.getItem('b_access') !== 'granted') {
            window.location.href = "index.html"; 
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prsnt-cms | run</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="local.css">
</head>
<body class="antialiased">

    <div id="navbar-placeholder"></div>

    <main class="view-container">
        <div class="grid-two-one">
            
            <div class="left-col">
                <section class="view-card">
                    <h1 class="view-title">03. run</h1>
                    <hr class="title-sep">

                    <nav class="breadcrumb">
                        <div class="crumb-line">
                            &gt; <a href="index.html">p01</a> 
                            &gt; <a href="page-00-00-title.html">title</a>
                            &gt; <span class="current">run</span>
                        </div>
                    </nav>

                    <div class="view-content">
                        <p>sub title</p>
                        
                        <div class="cardx-container">
                            <div class="cardx-col">
								
								<div class="cardx-lf-bttn">
									<div class="cardx-buttons" style="margin-top: 0px;">
										<button onclick="loadPard('aa', this)">01</button>
										<button onclick="loadPard('bb', this)">02</button>
									</div>
								</div>
								
                                <!-- data-first: left card aa loads by itself when the slide opens -->
                                <div id="pard-display-zone" data-first="aa" aria-live="polite"></div>
                                
                            </div>

                            <div class="cardx-col">
                                <!-- data-first: this card loads by itself when the slide opens (no need to copy it here).
                                     what is written inside only shows if that card file is missing -->
                                <div id="cardx-display" class="cardx-rg-top" data-first="aa" aria-live="polite">
                                    <p>[select card below]</p>
                                </div>
                                <div class="cardx-rg-btm">
									<div class="cardx-rg-bttn">
										<div class="cardx-buttons">
											<button onclick="loadCard('aa', this)">01</button>
											<button onclick="loadCard('bb', this)">02</button>
											<button onclick="loadCard('cc', this)">03</button>
											<button onclick="loadCard('dd', this)">04</button>
										</div>
									</div>
                                    <div class="cardx-summary">
                                        <button onclick="loadCard('ee', this)">---</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="control">
                            <div class="datmp">
                                &gt; <span id="current-timestamp"></span>
                            </div>
                            <div class="prvnxt">
                                <a href="page-02-00-mdl.html">&lt; prv</a>
                                <span class="nav-sep">|</span>
                                <a href="page-04-00-rslt.html">nxt &gt;</a>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="right-col">
                <div id="sidebar-placeholder-tp"></div>
                <div id="sidebar-placeholder-bt"></div>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        function updateTimestamp() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const element = document.getElementById('current-timestamp');
            if (element) {
                element.innerText = now.toLocaleDateString('en-US', options).toLowerCase();
            }
        }
        updateTimestamp();
        
        /* Card helpers
           cardVersion: on localhost every card is fetched fresh (edit a .txt, reload, see it);
                        on vercel the browser may cache the cards, so slides open faster.
           markOn:      highlights the button of the card on screen (class "on", local.css section 4).
           data-first:  a display zone with data-first="aa" loads that card when the slide opens. */
        function cardVersion() {
            const local = ['localhost', '127.0.0.1'].includes(location.hostname);
            return local ? `?v=${Date.now()}` : '';
        }
        function markOn(zone, btn) {
            const col = zone.closest('.cardx-col');
            if (!col) return;
            col.querySelectorAll('.cardx-buttons button, .cardx-summary button').forEach(b => b.classList.toggle('on', b === btn));
        }

        /* Left Column Swap Logic */
        async function loadPard(suffix, btn) {
            const displayZone = document.getElementById('pard-display-zone');
            const fileName = `page-03-02-${suffix}.txt` + cardVersion();
        
            try {
                const response = await fetch(fileName);
                if (response.ok) {
                    displayZone.innerHTML = await response.text();
                    markOn(displayZone, btn);
                }
            } catch (error) { 
                console.error("fetch error:", error); 
            }
        }
        
        /* Right Column Card Logic */
        async function loadCard(suffix, btn) {
            const displayZone = document.getElementById('cardx-display');
            const fileName = `page-03-01-${suffix}.txt` + cardVersion();
            
            try {
                const response = await fetch(fileName);
                if (response.ok) {
                    displayZone.innerHTML = await response.text();
                    markOn(displayZone, btn);
                }
            } catch (error) { console.error("fetch error:", error); }
        }

        /* Global Component Loader */
        async function loadComponent(id, file, isGlobal = false) {
            const element = document.getElementById(id);
            if (!element) return;
            try {
                const path = isGlobal ? `/${file}` : file;
                const response = await fetch(path);
                if (response.ok) {
                    element.innerHTML = await response.text();
                    /* mark the current slide in the contents list (class "here", local.css section 5) */
                    element.querySelectorAll('a').forEach(a => {
                        if (a.getAttribute('href') === location.pathname.split('/').pop()) a.classList.add('here');
                    });
                }
            } catch (error) { console.error("load failure:", file, error); }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadComponent('navbar-placeholder', 'elements/navbar.html', true);
            loadComponent('footer-placeholder', 'elements/footer.html', true);
            loadComponent('sidebar-placeholder-tp', 'rght-clmn-b-tp.html');
            loadComponent('sidebar-placeholder-bt', 'rght-clmn-b-bt.html');

            /* first cards: every zone with data-first loads that card, its button lit */
            document.querySelectorAll('[data-first]').forEach(zone => {
                const load = zone.id === 'pard-display-zone' ? loadPard : loadCard;
                const btn = zone.closest('.cardx-col').querySelector(`button[onclick*="'${zone.dataset.first}'"]`);
                load(zone.dataset.first, btn);
            });
        });
    </script>
</body>
</html>
